name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

      - name: Build release APK (arm64 + armv7)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

      - name: Collect APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" CallMitra-AI.apk
          ls -lh CallMitra-AI.apk

      - name: Publish public download link (GitHub Release "latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CallMitra-AI.apk \
            --title "CallMitra AI (latest build)" \
            --notes "Demo build ${GITHUB_SHA::7}. Live calling is off until the cloud backend and phone provider are connected." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: CallMitra-AI-apk
          path: CallMitra-AI.apk
